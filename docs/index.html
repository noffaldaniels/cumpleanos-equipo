<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cumpleaños del equipo</title>
<style>
:root{--fondo:#f4f6fa;--tarjeta:#fff;--texto:#1b2333;--suave:#5b6577;--azul:#1f3864;--hoy:#fff3cd;--hoy-texto:#664d03;--peligro:#c0392b;--borde:#d6dbe4}
@media (prefers-color-scheme:dark){:root{--fondo:#11151c;--tarjeta:#1b212b;--texto:#e8ecf2;--suave:#9aa4b5;--azul:#8fb3ff;--hoy:#3a3218;--hoy-texto:#ffe08a;--peligro:#ff6b5b;--borde:#2c3442}}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--texto);font:16px/1.45 system-ui,sans-serif}
header{background:#1f3864;color:#fff;padding:14px 16px}
header h1{margin:0;font-size:20px}header p{margin:2px 0 0;font-size:14px;opacity:.9}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px}
nav button{white-space:nowrap;border:1px solid var(--suave);border-radius:16px;padding:4px 10px;color:var(--texto);background:none;font-size:14px;cursor:pointer}
nav .activo{background:var(--azul);color:var(--fondo);border-color:var(--azul)}
main{padding:0 16px 32px;max-width:760px;margin:auto}
h2{font-size:17px;margin:0}
.barra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:6px 0 4px}
.barra .total{color:var(--suave);font-size:14px}
.accion{border:1px solid var(--azul);background:var(--tarjeta);color:var(--azul);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}
.principal{background:var(--azul);color:var(--fondo)}
button.peligro{border-color:var(--peligro);color:var(--peligro)}
details{background:var(--tarjeta);border-radius:10px;margin:10px 0;padding:0 12px}
details[open]{padding-bottom:6px}
summary{cursor:pointer;padding:12px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";color:var(--suave);font-size:18px}details[open]>summary::after{content:"▴"}
details.hoy{background:var(--hoy)}details.hoy h2{color:var(--hoy-texto)}
.persona{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--borde);overflow-wrap:anywhere}
.persona:first-of-type{border-top:0}
.fecha{flex:0 0 54px;font-weight:700;color:var(--azul);font-size:14px;line-height:1.2;padding-top:2px}
.fecha small{display:block;font-weight:400;color:var(--suave);font-size:12px}
.quien{flex:1;min-width:0}.detalle{color:var(--suave);font-size:14px}
.botones{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.botones button{font-size:13px;padding:3px 9px}
.vacio{color:var(--suave);font-size:14px;padding:4px 0 10px}
.panel{background:var(--tarjeta);border-radius:10px;padding:14px;margin:12px 0;border:1px solid var(--borde)}
.panel label{display:block;font-size:14px;margin:8px 0 2px}
.panel input,.panel select{width:100%;font:inherit;padding:8px;border:1px solid var(--borde);border-radius:8px;background:var(--fondo);color:var(--texto)}
.fila{display:flex;gap:8px}.fila>div{flex:1}
.aviso{background:var(--hoy);color:var(--hoy-texto);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:14px}
.error{color:var(--peligro);font-size:14px}
textarea{width:100%;min-height:160px;font:14px/1.4 system-ui,sans-serif;padding:8px;border-radius:8px;border:1px solid var(--borde);background:var(--fondo);color:var(--texto)}
footer{text-align:center;padding:8px 16px 24px;font-size:13px;color:var(--suave)}
footer button{background:none;border:0;color:var(--suave);text-decoration:underline;cursor:pointer;font-size:13px}
.oculto{display:none}
.av{flex:0 0 48px;width:48px;height:48px;border-radius:50%;padding:0;border:0;background:var(--borde);overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.sin{background:none;border:2px dashed var(--suave);color:var(--suave);font-size:11px;line-height:1.1}
.av.cargando{font-size:10px;color:var(--suave);cursor:default}
.visor{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.visor .panel{max-width:520px;width:100%;max-height:100%;overflow:auto;margin:0}
.visor img.grande{width:100%;max-height:65vh;object-fit:contain;border-radius:8px;display:block;margin:8px 0}
a.accion{display:inline-block;text-decoration:none}
</style>
</head>
<body>
<header><h1>🎂 Cumpleaños del equipo</h1><p id="subtitulo">Oficina del Diputado Felipe Ferro</p></header>
<nav id="meses" class="oculto"></nav>
<main id="contenido"><p class="vacio">Cargando…</p></main>
<footer id="pie" class="oculto"><button id="salir" type="button">Cambiar de clave</button></footer>
<input id="archivo-foto" class="oculto" type="file" accept="image/*">
<script src="config.js"></script>
<script src="logica.js"></script>
<script src="app.js"></script>
</body>
</html>
